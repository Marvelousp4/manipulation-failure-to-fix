[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manipulation-failure-to-fix"
version = "0.1.0"
description = "Reproducible manipulation-policy failure evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary - license pending review"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]
sim = ["gymnasium>=0.29", "mani_skill>=3.0"]

[project.scripts]
f2f = "failure2fix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
